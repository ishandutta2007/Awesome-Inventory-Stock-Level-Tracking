<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Dynamic / Animated aspects placed in background */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.8; }
      50% { transform: translateY(60px); opacity: 0.3; }
      100% { transform: translateY(0px); opacity: 0.8; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .floating-card-1 {
      animation: floatBox 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatBox 7s ease-in-out infinite 1.5s;
    }
    .scanner-beam {
      animation: scanBeam 3.5s ease-in-out infinite;
    }
    .flowing-path {
      stroke-dasharray: 8, 8;
      animation: flowLine 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#orbGlow)" class="pulsing-orb-1" opacity="0.25" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" filter="url(#orbGlow)" class="pulsing-orb-2" opacity="0.3" />

  <!-- Dynamic Warehouse / Network Diagram Nodes in Background (Right side) -->
  <g opacity="0.75">
    <!-- Flow connecting lines -->
    <path class="flowing-path" d="M 850 130 L 980 180 L 1100 130" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />
    <path class="flowing-path" d="M 980 180 L 980 290" fill="none" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2" />
    <path class="flowing-path" d="M 980 290 L 850 330" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="2" />

    <!-- Node 1: Stock Level Ingestion -->
    <g class="floating-card-1" transform="translate(800, 95)">
      <rect width="130" height="65" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
      <text x="65" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">📦 INBOUND</text>
      <text x="65" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Barcode / RFID</text>
      <!-- Scanner animation line -->
      <line x1="15" y1="36" x2="115" y2="36" stroke="#38bdf8" stroke-width="2" class="scanner-beam" opacity="0.7" />
    </g>

    <!-- Node 2: Central WMS Core -->
    <g transform="translate(930, 160)">
      <rect width="145" height="75" rx="12" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.7)" stroke-width="2" filter="url(#glow)" />
      <text x="72" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">⚡ REAL-TIME SYNC</text>
      <text x="72" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">WMS &amp; Multi-Hub</text>
      <circle cx="20" cy="30" r="4" fill="#10b981" />
    </g>

    <!-- Node 3: Omnichannel Outbound -->
    <g class="floating-card-2" transform="translate(1040, 95)">
      <rect width="125" height="65" rx="10" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.5" />
      <text x="62" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#e879f9">🛒 CHANNELS</text>
      <text x="62" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Shopify / Amazon</text>
    </g>

    <!-- Node 4: Automated Order Fulfillment -->
    <g class="floating-card-1" transform="translate(860, 275)">
      <rect width="140" height="65" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
      <text x="70" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🚚 FULFILLMENT</text>
      <text x="70" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Pick, Pack &amp; Ship</text>
    </g>
  </g>

  <!-- Foreground Content (Solid, Crisp, Unobscured) -->
  <g transform="translate(80, 85)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="310" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" class="pill-text">CURATED REPOSITORY &amp; DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Inventory &amp; Stock</tspan>
    </text>
    <text x="0" y="132" class="title-text">
      Tracking Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="180" class="subtitle-text">
      Production-Ready SaaS Platforms &amp; Self-Hosted Open-Source Solutions
    </text>
    <text x="0" y="208" class="subtitle-text" font-size="16" fill="#64748b">
      WMS • Multi-Warehouse Fulfillment • Barcode/QR • Demand Forecasting • Omni-Channel OMS
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="67" y="21" text-anchor="middle" class="badge-pill-text">🏢 SaaS Giants</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="165" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="227" y="21" text-anchor="middle" class="badge-pill-text">💻 20+ Open-Source</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="150" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="395" y="21" text-anchor="middle" class="badge-pill-text">📊 Pricing &amp; Stars</text>

      <!-- Pill 4 -->
      <rect x="480" y="0" width="150" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="555" y="21" text-anchor="middle" class="badge-pill-text">🚀 Production WMS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
